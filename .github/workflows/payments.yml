# Automatic TradAI Pro keys from crypto payments.
# Buyers pay, send the transaction ID to the bot, and this workflow checks the chain and
# replies with a signed key. It lives in the public releases repo so scheduled runs are free.
name: Payments

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: payments
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup check
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
          OXAPAY_MERCHANT_KEY: ${{ secrets.OXAPAY_MERCHANT_KEY }}
        run: node payments/bot.js --check

      # GitHub runs the 5-minute schedule only every few hours, so each run keeps the bot
      # answering for almost 6 hours (a check every 20 s) and saves state after each change.
      - name: Answer the bot for up to 5h50
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          LICENSE_PRIVATE_KEY: ${{ secrets.LICENSE_PRIVATE_KEY }}
          OXAPAY_MERCHANT_KEY: ${{ secrets.OXAPAY_MERCHANT_KEY }}
        run: |
          git config user.name "TradAI payments"
          git config user.email "payments@users.noreply.github.com"
          end=$((SECONDS + 5*3600 + 50*60))
          while [ $SECONDS -lt $end ]; do
            node payments/bot.js || echo "bot pass failed, retrying"
            # Commit only real changes, not the timestamp the bot writes on every pass
            if git diff -U0 -- payments/state.json | grep -E '^[+-][^+-]' | grep -qv '"updatedAt"'; then
              git add payments/state.json
              git commit -q -m "Payments state $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase origin main && git push -q || echo "state push failed, will retry"
            fi
            sleep 20
          done
